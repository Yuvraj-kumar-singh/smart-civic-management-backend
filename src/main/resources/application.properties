spring.application.name=smartcivicsystem

# Secrets (DB password) local.properties se aate hain. Ye file GitHub pe nahi jayegi.
spring.config.import=optional:file:./local.properties

# Database
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/civic_management_system
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false